# Nightly data refresh.
#
# Fetches real incident / boundary / population / calls-for-service data and
# commits the snapshots under data/cache/. Deployments that can't reach the
# city APIs directly (e.g. Streamlit Community Cloud blocked by a WAF) then
# serve real data via the loader's snapshot tier — the repo is the data relay.
#
# The job fails loudly if no city could be fetched, so endpoint breakage shows
# up in the Actions tab instead of silently degrading to synthetic data.

name: Refresh data snapshots

on:
  schedule:
    - cron: "17 9 * * *" # 05:17 ET daily (09:17 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: "History window in days (default: per-city max, 3 years)"
        required: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "${{ inputs.days }}" ]; then EXTRA="--days ${{ inputs.days }}"; fi
          python scripts/refresh_data.py $EXTRA

      # A successful refresh always writes at least one new timestamped
      # snapshot directory, so "nothing staged" here can only mean the relay
      # is broken (e.g. data/cache gitignored again, or the refresh script
      # wrote somewhere the app doesn't read). Fail loudly instead of
      # silently shipping stale/fixture data — this exact failure mode once
      # made every nightly run a no-op for months.
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git check-ignore -q data/cache; then
            echo "::error::data/cache is gitignored — snapshots can never be committed. Fix .gitignore."
            exit 1
          fi
          git add data/cache
          if git diff --cached --quiet; then
            echo "::error::Refresh succeeded but staged no snapshot changes under data/cache — the data relay is broken."
            exit 1
          fi
          git commit -m "Refresh data snapshots ($(date -u +%F))"
          git push
